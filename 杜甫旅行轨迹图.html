<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>杜甫旅行轨迹图</title>
<style>
  :root{
    --bg:#0d1420; --panel:#141d2b; --panel2:#1a2536; --line:#24324a;
    --gold:#e8c877; --ink:#e8ecf3; --sub:#9aa8bd; --dim:#6b7a90;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,#16243a 0%,var(--bg) 60%);
    color:var(--ink);font-family:"Noto Serif SC","Songti SC","STSong",serif;line-height:1.7}
  .wrap{max-width:1200px;margin:0 auto;padding:34px 22px 60px}
  header{text-align:center;margin-bottom:26px}
  h1{font-size:34px;letter-spacing:6px;margin:0 0 8px;color:var(--gold);font-weight:600}
  .sub{color:var(--sub);font-size:15px;letter-spacing:1px}
  .sub b{color:#cbd5e3}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:18px}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel) 0%,#111a27 100%);
    border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .mapbox{position:relative}
  svg{display:block;width:100%;height:auto}
  .prov{fill:#1b2740;stroke:#2c3d5c;stroke-width:.7;transition:fill .2s}
  .route{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;
    opacity:.85;transition:opacity .25s,stroke-width .25s}
  .route.dim{opacity:.12}
  .route.hot{opacity:1;stroke-width:3.6}
  .dot{cursor:pointer;transition:r .15s,opacity .2s}
  .dot:hover{r:7}
  .dot.dim{opacity:.15}
  .lbl{font-size:10px;fill:#aebbd0;font-family:system-ui,sans-serif;pointer-events:none;
    paint-order:stroke;stroke:#0d1420;stroke-width:2.4px;stroke-linejoin:round;transition:opacity .2s}
  .lbl.hot{fill:#fff;font-weight:700}
  .lbl.dim{opacity:.15}
  .legend{padding:14px 16px;border-top:1px solid var(--line)}
  .leg{display:flex;flex-wrap:wrap;gap:8px}
  .leg button{display:flex;align-items:center;gap:7px;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;
    font-size:12.5px;font-family:inherit;transition:.2s}
  .leg button:hover,.leg button.on{border-color:var(--gold);background:#22304a}
  .sw{width:11px;height:11px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .side{display:flex;flex-direction:column;gap:14px}
  .sec{padding:16px}
  .sec h2{font-size:15px;margin:0 0 12px;color:var(--gold);letter-spacing:2px;font-weight:600}
  #detail .big{font-size:22px;color:#fff;margin-bottom:2px}
  #detail .yr{display:inline-block;background:#2a3a58;color:var(--gold);border-radius:6px;
    padding:1px 9px;font-size:12px;font-family:system-ui,sans-serif;margin-bottom:10px}
  #detail .row{margin:9px 0;font-size:14px}
  #detail .k{color:var(--dim);font-size:12px;display:block;margin-bottom:1px}
  #detail .poem{color:var(--gold);font-style:italic}
  #detail .hint{color:var(--sub);font-size:13px}
  .tl{max-height:460px;overflow:auto;padding-right:4px}
  .tl::-webkit-scrollbar{width:6px}.tl::-webkit-scrollbar-thumb{background:#2c3d5c;border-radius:3px}
  .ti{display:flex;gap:10px;padding:7px 6px;border-radius:8px;cursor:pointer;transition:.15s}
  .ti:hover,.ti.on{background:#22304a}
  .ti .bar{width:3px;border-radius:2px;flex:none}
  .ti .t{font-size:13px;color:var(--ink)}
  .ti .t small{display:block;color:var(--dim);font-size:11px;font-family:system-ui,sans-serif}
  footer{text-align:center;color:var(--dim);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>杜甫旅行轨迹图</h1>
    <div class="sub">一生漂泊 <b>30+</b> 州县 · 行程数万里 · 诗一千四百余首　｜　点击地点看事迹，点击图例看某段旅程</div>
  </header>
  <div class="layout">
    <div class="card mapbox">
      <svg id="map" viewBox="0 0 1000 720"></svg>
      <div class="legend"><div class="leg" id="leg"></div></div>
    </div>
    <div class="side">
      <div class="card sec" id="detail">
        <h2>地点详情</h2>
        <div class="hint">在地图上点选一个圆点，或从下方时间轴中选择。</div>
      </div>
      <div class="card sec">
        <h2>行迹时间轴</h2>
        <div class="tl" id="tl"></div>
      </div>
    </div>
  </div>
  <footer>据《杜甫传》附录二·分年旅行轨迹详表绘制 · 地点为示意，凡争议处采通行之说 · 离线可用</footer>
</div>

  gDot.appendChild(dot); dotEls.push(dot);
  const left = (i % 2 === 1);
  const t = el('text',{x:p.x+(left?-6:6),y:p.y-5,class:'lbl','text-anchor': left?'end':'start'});
  t.textContent=p.name; gDot.appendChild(t); lblEls.push(t);
});
svg.appendChild(gDot);
const leg=document.getElementById('leg');
let activeRoute=null;
D.routes.forEach(r=>{
  const b=document.createElement('button');
  b.innerHTML='<span class="sw" style="background:'+r.color+';color:'+r.color+'"></span>'+r.name+' <small style="color:#6b7a90">'+r.years+'</small>';
  b.onclick=()=>{
    activeRoute = (activeRoute===r.n)?null:r.n;
    [...leg.children].forEach((x,i)=>x.classList.toggle('on',D.routes[i].n===activeRoute));
    routeEls.forEach(p=>{const n=+p.getAttribute('data-n');
      p.classList.toggle('dim',activeRoute&&n!==activeRoute);
      p.classList.toggle('hot',activeRoute&&n===activeRoute);});
    dotEls.forEach((d,i)=>{const on=!activeRoute||D.places[i].period+1===activeRoute;
      d.classList.toggle('dim',!on); lblEls[i].classList.toggle('dim',!on);});
  };
  leg.appendChild(b);
});
const tl=document.getElementById('tl');
D.places.forEach((p,i)=>{
  const c = D.routes.find(r=>r.n===p.period+1)?.color || '#cfd8e3';
  const div=document.createElement('div'); div.className='ti'; div.dataset.i=i;
  div.innerHTML='<div class="bar" style="background:'+c+'"></div><div class="t">'+p.name+'<small>'+p.year+' · '+p.now+'</small></div>';
  div.onclick=()=>select(i);
  tl.appendChild(div);
});
const detail=document.getElementById('detail');
function select(i){
  const p=D.places[i];
  const c = D.routes.find(r=>r.n===p.period+1)?.color || '#cfd8e3';
  [...tl.children].forEach(x=>x.classList.toggle('on',+x.dataset.i===i));
  dotEls.forEach((d,j)=>d.setAttribute('r',j===i?7:4.2));
  lblEls.forEach((t,j)=>t.classList.toggle('hot',j===i));
  detail.innerHTML='<h2>地点详情</h2>'+
    '<div class="big" style="color:'+c+'">'+p.name+'</div>'+
    '<span class="yr">'+p.year+'</span>'+
    '<div class="row"><span class="k">今地</span>'+p.now+'</div>'+
    '<div class="row"><span class="k">事迹</span>'+p.deed+'</div>'+
    '<div class="row"><span class="k">相关诗作</span><span class="poem">'+p.poem+'</span></div>';
}
</script>
</body>
